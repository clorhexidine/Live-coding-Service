<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ввод текста</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-root">
    <header class="tabs-bar">
      <div class="tabs" id="tabs"></div>
      <button class="tab-add" id="tab-add" type="button" title="Новый файл">+</button>
    </header>
    <main class="editor-wrap">
      <div class="line-numbers" id="line-numbers" aria-hidden="true"></div>
      <textarea
        id="text-input"
        class="text-column"
        placeholder="Введите текст здесь..."
        spellcheck="true"
        autofocus
      ></textarea>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
