<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная — Live coding</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/pages.css">
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <h1>Комнаты</h1>
      <button type="button" class="btn-logout" id="btn-logout">Выход</button>
    </header>

    <div class="dashboard-actions">
      <button type="button" class="btn-create" id="btn-create">Создать комнату</button>
      <button type="button" class="btn-join-code" id="btn-open-join-code">Войти по коду</button>
    </div>
    <p class="empty-hint" id="loading">Загрузка…</p>
    <ul class="room-list" id="room-list" style="display:none"></ul>
  </div>

  <div id="create-room-overlay" class="room-settings-overlay" style="display:none">
    <div class="room-settings-dialog room-settings-dialog--create" role="dialog" aria-modal="true" aria-labelledby="cr-title">
      <h2 id="cr-title" class="room-settings-h2">Новая комната</h2>
      <div class="create-room-block">
        <div class="room-settings-label">Название</div>
        <input id="create-title" type="text" maxlength="255" class="room-settings-title-input" />
      </div>
      <div class="create-room-block">
        <div class="room-settings-label">Пароль комнаты</div>
        <div id="create-pw-pin" class="pin-row-host"></div>
      </div>
      <p class="room-settings-error" id="create-err" style="display:none"></p>
      <div class="room-settings-actions room-settings-actions--row">
        <button type="button" class="app-modal-btn app-modal-btn--secondary" id="create-cancel">Отмена</button>
        <button type="button" class="btn-primary" id="create-submit">Создать</button>
      </div>
    </div>
  </div>

  <div id="home-join-pw-overlay" class="room-settings-overlay" style="display:none">
    <div class="room-settings-dialog room-settings-dialog--narrow" role="dialog" aria-modal="true">
      <h2 class="room-settings-h2">Пароль комнаты</h2>
      <p class="room-settings-sub">Введите пароль из 6 символов.</p>
      <div id="home-join-pw-pin" class="pin-row-host"></div>
      <p class="room-settings-error" id="home-join-pw-err" style="display:none"></p>
      <div class="room-settings-actions room-settings-actions--row">
        <button type="button" class="app-modal-btn app-modal-btn--secondary" id="home-join-pw-cancel">Отмена</button>
        <button type="button" class="btn-primary" id="home-join-pw-submit">Войти</button>
      </div>
    </div>
  </div>

  <div id="home-join-code-overlay" class="room-settings-overlay" style="display:none">
    <div class="room-settings-dialog room-settings-dialog--narrow" role="dialog" aria-modal="true" aria-labelledby="join-code-title">
      <h2 class="room-settings-h2" id="join-code-title">Войти по коду</h2>
      <p class="room-settings-sub">Введите 6-символьный код комнаты.</p>
      <div id="home-join-code-pin" class="pin-row-host" aria-label="Код приглашения"></div>
      <p class="field-hint field-hint--error" id="join-code-hint" style="display:none"></p>
      <div class="room-settings-actions room-settings-actions--row">
        <button type="button" class="app-modal-btn app-modal-btn--secondary" id="btn-join-code-cancel">Отмена</button>
        <button type="button" class="btn-primary" id="btn-join-by-code">Войти в комнату</button>
      </div>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/modal.js"></script>
  <script src="/static/pin-ui.js"></script>
  <script src="/static/room-settings.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
