<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Комната — Live coding</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/pages.css">
</head>
<body>
  <div class="app-root app-root--room">
    <header class="room-topbar">
      <div class="room-topbar-row">
        <a href="/home" class="btn-back" id="btn-back">← На главную</a>
        <div class="room-title-inline-host" id="room-title-inline-host">
          <button type="button" class="btn-room-gear btn-room-gear--toolbar" id="btn-room-settings" hidden aria-label="Настройки комнаты">⚙</button>
          <span class="room-title room-title--inline" id="room-title">Комната</span>
        </div>
      </div>
      <div class="room-desc-block">
        <textarea
          id="room-description"
          class="room-description"
          rows="1"
          spellcheck="false"
          placeholder="Описание задачи (видно всем в комнате)…"
        ></textarea>
        <p class="room-desc-hint" id="room-desc-hint"></p>
      </div>
    </header>
    <header class="tabs-bar">
      <div class="tabs" id="tabs"></div>
      <button class="tab-add" id="tab-add" type="button" title="Новый файл">+</button>
    </header>
    <main class="editor-wrap">
      <div class="line-numbers" id="line-numbers" aria-hidden="true"></div>
      <div class="comment-gutter" id="comment-gutter" aria-hidden="true"></div>
      <div class="editor-input-wrap">
        <pre class="editor-highlight-pre" id="editor-highlight" aria-hidden="true"></pre>
        <textarea
          id="text-input"
          class="text-column"
          placeholder="Введите текст здесь..."
          spellcheck="false"
        ></textarea>
      </div>
    </main>
  </div>
  <div class="code-tooltip" id="code-tooltip" role="tooltip"></div>
  <div id="comment-popover" class="comment-popover" style="display: none" role="dialog" aria-modal="true">
    <div class="comment-popover-label" id="comment-popover-label">Комментарий</div>
    <pre class="comment-popover-snippet" id="comment-snippet"></pre>
    <textarea id="comment-body-input" class="comment-body-input" rows="4" spellcheck="false" placeholder="Текст комментария…"></textarea>
  </div>
  <button type="button" class="btn-add-comment-floating" id="btn-add-comment" disabled>Добавить комментарий</button>
  <div class="tab-menu comment-ctx-menu" id="comment-ctx-menu" style="display: none">
    <button type="button" class="tab-menu-item" data-action="edit-comment">Редактировать</button>
    <button type="button" class="tab-menu-item" data-action="delete-comment">Удалить</button>
  </div>
  <script src="/static/auth.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/modal.js"></script>
  <script src="/static/pin-ui.js"></script>
  <script src="/static/room-settings.js"></script>
  <script src="/static/room.js"></script>
</body>
</html>
