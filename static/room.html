<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Комната — Live coding</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/pages.css">
</head>
<body>
  <div class="app-root app-root--room">
    <header class="room-topbar">
      <div class="room-topbar-row room-topbar-row--main">
        <a href="/home" class="btn-back" id="btn-back">← На главную</a>
        <span class="room-title room-title--inline room-title--topbar" id="room-title">Комната</span>
        <div class="room-topbar-end">
          <div class="room-download-wrap" id="room-download-wrap">
            <button
              type="button"
              class="btn-room-gear btn-room-gear--toolbar btn-room-download"
              id="btn-room-download"
              aria-label="Скачать"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <svg class="btn-room-download-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
                />
              </svg>
            </button>
            <div id="room-download-menu" class="room-download-menu" role="menu">
              <button type="button" class="room-download-menu-item" data-download="file" role="menuitem">
                <svg class="room-download-menu-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
                  />
                </svg>
                <span>Скачать файл</span>
              </button>
              <button type="button" class="room-download-menu-item" data-download="project" role="menuitem">
                <svg class="room-download-menu-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
                  />
                </svg>
                <span>Скачать проект</span>
              </button>
            </div>
          </div>
          <button type="button" class="btn-room-gear btn-room-gear--toolbar" id="btn-room-settings" hidden aria-label="Настройки комнаты">⚙</button>
          <button type="button" class="btn-room-leave-toolbar" id="btn-room-leave" hidden>Выйти из комнаты</button>
        </div>
      </div>
      <div class="room-desc-block">
        <textarea
          id="room-description"
          class="room-description"
          rows="1"
          spellcheck="false"
          placeholder="Описание задачи (видно всем в комнате)…"
        ></textarea>
        <p class="room-desc-hint" id="room-desc-hint"></p>
      </div>
    </header>
    <header class="tabs-bar">
      <div class="tabs" id="tabs"></div>
      <button class="tab-add" id="tab-add" type="button" title="Новый файл">+</button>
    </header>
    <main class="editor-wrap">
      <div class="line-numbers" id="line-numbers" aria-hidden="true"></div>
      <div class="comment-gutter" id="comment-gutter" aria-hidden="true"></div>
      <div class="editor-input-wrap">
        <pre class="editor-highlight-pre" id="editor-highlight" aria-hidden="true"></pre>
        <textarea
          id="text-input"
          class="text-column"
          placeholder="Введите текст здесь..."
          spellcheck="false"
        ></textarea>
      </div>
    </main>
  </div>
  <div class="code-tooltip" id="code-tooltip" role="tooltip"></div>
  <div id="comment-popover" class="comment-popover" style="display: none" role="dialog" aria-modal="true">
    <div class="comment-popover-label" id="comment-popover-label">Комментарий</div>
    <pre class="comment-popover-snippet" id="comment-snippet"></pre>
    <textarea id="comment-body-input" class="comment-body-input" rows="4" spellcheck="false" placeholder="Текст комментария…"></textarea>
    <div class="comment-popover-actions">
      <button type="button" class="btn-primary comment-popover-save" id="btn-comment-save">Сохранить</button>
    </div>
  </div>
  <button type="button" class="btn-add-comment-floating" id="btn-add-comment" disabled>Добавить комментарий</button>
  <div class="tab-menu comment-ctx-menu" id="comment-ctx-menu" style="display: none">
    <button type="button" class="tab-menu-item" data-action="edit-comment">Редактировать</button>
    <button type="button" class="tab-menu-item" data-action="delete-comment">Удалить</button>
  </div>
  <script src="/static/auth.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/modal.js"></script>
  <script src="/static/pin-ui.js"></script>
  <script src="/static/room-settings.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="/static/room.js"></script>
</body>
</html>
